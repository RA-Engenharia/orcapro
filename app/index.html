  <script>/* LOTE 5: aplica o tema salvo ANTES do primeiro paint (mata o flash branco no dark) */
  try { var _t = localStorage.getItem("orcapro:tema") || "light";
        var _f = localStorage.getItem("orcapro:fonte"); _f = (_f === "source") ? "source" : "plex";
        document.documentElement.setAttribute("data-tema", _t);
        document.documentElement.setAttribute("data-fonte", _f); } catch (e) {}
  /* CARA NOVA — PADRÃO PARA TODOS desde a 1.2.128 (aprovada pelo Rogério em
     08/10/2026; foi prévia `?previa=visual` na 1.2.127). Marca a raiz ANTES do
     primeiro paint: o css/visual.css e o BIM novo (fita B1, desenho 2D, famílias,
     estilos) só valem sob html[data-visual="nova"].
     Volta ao visual antigo NESTE aparelho: `?previa=visual-desligar` (grava
     `orcapro:tela:visual:off`); `?previa=visual` religa. A chave antiga da prévia
     (`orcapro:tela:visual:v1`) não decide mais nada. */
  (function () {
    var q = location.search, off = /[?&]previa=[^&]*visual-desligar/i.test(q);
    /* armazenamento bloqueado (aba anônima, política do navegador) não pode
       derrubar a cara nova: sem como ler a escolha, vale o padrão */
    try {
      if (off) localStorage.setItem("orcapro:tela:visual:off", "1");
      else if (/[?&]previa=[^&]*visual(?!-desligar)/i.test(q)) localStorage.removeItem("orcapro:tela:visual:off");
      else off = localStorage.getItem("orcapro:tela:visual:off") === "1";
    } catch (e) {}
    if (off) return;
    try {
      document.documentElement.setAttribute("data-visual", "nova");
      var lv = document.createElement("link"); lv.rel = "stylesheet"; lv.href = "css/fontes-visual.css"; document.head.appendChild(lv);
    } catch (e) {}
  })();
  /* APP DA GOOGLE PLAY (`?origem=play`, o startUrl do TWA em OrcaPRO-Android):
     a política da loja não deixa vender por fora dela, então quem abre pelo app
     não vê botão de compra. Fica gravado porque a navegação interna perde a URL. */
  try { if (/[?&]origem=play\b/i.test(location.search)) localStorage.setItem("orcapro:origem", "play");
        if (localStorage.getItem("orcapro:origem") === "play") document.documentElement.setAttribute("data-origem", "play"); } catch (e) {}</script>

  <script>
  (function () {
    if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
    /* ⚠ AS FAMÍLIAS SÓ DE PROPOSTA (css/fontes-proposta.css, 165 KB comprimidos)
       entram DEPOIS que o app abriu: no <head> elas seguravam o primeiro desenho
       de todo mundo para servir a uma tela só (ver o comentário do arquivo). */
    window.addEventListener('load', function () {
      try { var lf = document.createElement('link'); lf.rel = 'stylesheet'; lf.href = 'css/fontes-proposta.css'; document.head.appendChild(lf); } catch (e) {}
    });
    /* ⚠ O BOTÃO SAIU DAQUI E FOI PARA A BARRA DE CIMA (js/ui.js).
       O balão flutuante que morava aqui tinha três defeitos que o deixavam
       invisível justamente para quem mais precisa dele:
       (a) só nascia no evento `beforeinstallprompt`, que NÃO EXISTE no iOS —
           iPhone e iPad nunca viram esse botão;
       (b) o ✕ gravava dispensa PERMANENTE em localStorage: um toque sem
           querer e o recurso não voltava nunca mais;
       (c) disputava o canto inferior direito com o FAB do BIM.
       Aqui fica só o registro do service worker e a captura do evento, que
       é guardado em `window.OPR_INSTALL` para o botão da barra usar quando
       o navegador de fato oferecer instalação nativa. */
    window.OPR_INSTALL = null;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.OPR_INSTALL = e; });
    window.addEventListener('appinstalled', function () {
      window.OPR_INSTALL = null;
      /* o botão da barra some sozinho: ele pergunta por display-mode standalone */
      try { if (window.App && App.render) App.render(); } catch (e) {}
    });
    /* limpa a dispensa permanente que a versão antiga podia ter gravado —
       sem isto, quem clicou no ✕ uma vez continuaria sem o recurso */
    try { localStorage.removeItem('opr_install_dismiss'); } catch (e) {}
  })();
  </script>
