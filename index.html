<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrçaPRO IA — Orçamento de obra com Inteligência Artificial</title>
<meta name="description" content="OrçaPRO IA — orçamento de obra com SINAPI oficial, BDI do TCU, gestão completa da obra e BIM 3D ao 7D. Teste grátis por 7 dias.">

<!-- ====================================================================
     ⚠ ESTA PÁGINA VIROU REDIRECIONAMENTO EM 12/08/2026.

     Havia DUAS vitrines no ar ao mesmo tempo: esta (GitHub Pages) e a loja
     em orcapro.raengenhariaespecial.com.br. As duas com os preços escritos
     à mão, e já divergindo: aqui ainda se anunciava R$ 1.997 e R$ 2.997,
     preços que saíram de linha. Quem chegasse por aqui via um número, quem
     chegasse pela loja via outro.

     Uma vitrine só resolve isso na origem — não há como divergir de duas
     páginas quando existe uma. O conteúdo desta ficou no histórico do git
     (commit anterior a este) caso algum texto precise ser resgatado.

     ⚠ O QUE NÃO PODE QUEBRAR, e por isso continua intacto neste repositório:
       /app/            → o PWA que o cliente instala no celular
       /download/       → latest.json, que MOVE A FROTA nas atualizações
       /loja/portal.html, /bim/, /celular/, /consulta.html, /termos.html,
       /simulador/, /material/, /prints/
     Nada disso passa por este arquivo. Só a raiz redireciona.

     A querystring é PRESERVADA de propósito: há links de campanha com
     ?plano=, ?ref= e utm_* circulando em WhatsApp e Instagram, e perder
     esses parâmetros é perder a origem da venda.
     ==================================================================== -->

<link rel="canonical" href="https://orcapro.raengenhariaespecial.com.br/">
<meta http-equiv="refresh" content="0; url=https://orcapro.raengenhariaespecial.com.br/">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f2740; color: #eaf2fa;
    font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    padding: 24px; text-align: center;
  }
  .cx { max-width: 34rem; }
  img { width: 64px; height: 64px; margin-bottom: 18px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0 0 10px; }
  p { color: #b9cfe4; margin: 0 0 22px; }
  a.btn {
    display: inline-block; background: #2e6f9e; color: #fff; text-decoration: none;
    font-weight: 600; padding: 13px 26px; border-radius: 10px;
  }
  a.btn:hover { background: #3b83b5; }
  small { display: block; margin-top: 20px; color: #7f9bb5; font-size: 13px; }
  small a { color: #9dc4e4; }
</style>
</head>
<body>
  <div class="cx">
    <img src="logo.svg" alt="OrçaPRO">
    <h1>O site do OrçaPRO mudou de endereço</h1>
    <p>Estamos te levando para <b>orcapro.raengenhariaespecial.com.br</b>. Se não acontecer em alguns segundos, é só clicar:</p>
    <a class="btn" id="ir" href="https://orcapro.raengenhariaespecial.com.br/">Ir para o OrçaPRO →</a>
    <small>
      Procurando o aplicativo no celular? <a href="app/">Abrir o OrçaPRO web</a>.
    </small>
  </div>

<script>
/* Redireciona já, PRESERVANDO a querystring e o #ancora — os links de campanha
   (?plano=, ?ref=, utm_*) e os atalhos para seções precisam sobreviver ao salto.
   O <meta refresh> acima cobre quem estiver com o JS desligado; o botão cobre
   quem cair nos dois casos. */
(function () {
  var destino = 'https://orcapro.raengenhariaespecial.com.br/'
    + (location.search || '') + (location.hash || '');
  var btn = document.getElementById('ir');
  if (btn) btn.href = destino;
  try { location.replace(destino); } catch (e) { location.href = destino; }
})();
</script>
</body>
</html>
